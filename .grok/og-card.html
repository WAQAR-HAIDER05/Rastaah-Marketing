<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rastaah Marketing — OG</title>
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("fonts/Cinzel-Regular.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("fonts/CormorantGaramond-Italic.ttf") format("truetype");
      font-weight: 400 700;
      font-style: italic;
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0C0B0A;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background: url("hero.jpg") center / cover no-repeat;
    }
    .veil {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(12, 11, 10, 0.22) 0%, rgba(12, 11, 10, 0.58) 56%, rgba(12, 11, 10, 0.84) 100%);
    }
    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 90px 180px;
      box-sizing: border-box;
    }
    .mark {
      width: 30px;
      height: 30px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-family: "Cinzel", "Liberation Serif", serif;
      font-weight: 700;
      font-size: 88px;
      line-height: 0.94;
      letter-spacing: 0.145em;
      text-transform: uppercase;
      color: #C4A574;
      text-shadow: 0 2px 28px rgba(12, 11, 10, 0.55);
    }
    h1 span {
      display: block;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.58em;
      margin-top: 16px;
      padding-left: 0.58em;
      color: #F6F2EB;
    }
    .rule {
      width: 72px;
      height: 1px;
      background: #C4A574;
      margin: 26px 0 18px;
    }
    .tag {
      margin: 0;
      font-family: "Cormorant Garamond", "Liberation Serif", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.055em;
      color: #F6F2EB;
      text-shadow: 0 1px 16px rgba(12, 11, 10, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="veil"></div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#C4A574" d="M7.5 23.5h5.2l2.05-10.2h2.5L19.3 23.5h5.2L18.05 8.2h-4.1z"/>
        <path fill="#C4A574" d="M16 6.1 17.7 8.4 16 9.7 14.3 8.4z"/>
      </svg>
      <h1>Rastaah<span>Marketing</span></h1>
      <div class="rule"></div>
      <p class="tag">Your Path to Better Property Investment.</p>
    </div>
  </div>
</body>
</html>
